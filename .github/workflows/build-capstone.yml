name: Build and validate capstone deliverables
on:
  push:
    paths:
      - '.github/workflows/build-capstone.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned packages
        run: python -m pip install -r requirements.txt
      - name: Execute from empty generated directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data outputs models
          rm -f data/*.csv outputs/*.csv models/*
          python generate_data.py
          python part_a_clean_eda.py
          python part_b_regression.py
          python part_c_classification.py
          python part_d_segments.py
          python package_model.py
          python predict_delay.py
      - name: Validate outputs and repeated scoring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          assert len(pd.read_csv('data/hubs.csv')) == 24
          assert len(pd.read_csv('data/raw_shipments.csv')) == 1224
          assert len(pd.read_csv('data/new_shipments.csv')) == 48
          assert len(pd.read_csv('data/modelling_table.csv')) == 1200
          assert int(pd.read_csv('data/modelling_table.csv')['is_delayed'].sum()) == 278
          assert len(pd.read_csv('outputs/hub_segments.csv')) == 24
          assert len(pd.read_csv('outputs/new_shipment_actions.csv')) == 48
          assert int(pd.read_csv('outputs/new_shipment_actions.csv')['flagged'].sum()) == 8
          assert Path('models/delay_model.pkl').stat().st_size > 100000
          print('All core output invariants passed')
          PY
          sha256sum outputs/new_shipment_actions.csv | cut -d' ' -f1 > /tmp/actions.sha
          python predict_delay.py
          sha256sum outputs/new_shipment_actions.csv | cut -d' ' -f1 > /tmp/actions-again.sha
          diff /tmp/actions.sha /tmp/actions-again.sha
      - name: Commit generated deliverables, remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data outputs models
          git rm .github/workflows/build-capstone.yml
          git commit -m "Publish reproducible generated data, model and CSV outputs"
          git push origin HEAD:main
